name: SEO regressions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test scripts/seo.test.mjs
